name: Update regional event data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current and future regional event data
        run: node scripts/update-regional-event-data.mjs
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- data/tottori_events.csv data/kawasaki_events.csv)" ]; then
            echo "No event data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tottori_events.csv data/kawasaki_events.csv
          git commit -m "Update regional event data"
          git push
